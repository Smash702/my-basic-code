<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML + CSS + JS Interactive Card</title>
  
  <style>
    /* CSS: STYLING & LAYOUT */
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --text-color: #222222;
      --accent-color: #3b82f6;
    }

    /* Dark theme variable overrides */
    body.dark-mode {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #60a5fa;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
      transition: background-color 0.3s ease;
    }

    .score-display {
      font-size: 3rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 1rem 0;
    }

    /* Grid layout for action buttons */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    button {
      padding: 0.6rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: var(--accent-color);
      color: white;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.96);
    }

    .theme-btn {
      width: 100%;
      background-color: transparent;
      color: var(--text-color);
      border: 2px solid var(--accent-color);
    }
  </style>
</head>
<body>

  <!-- HTML: STRUCTURE -->
  <div class="card">
    <h2>Interactive Counter</h2>
    <div class="score-display" id="count">0</div>

    <div class="button-group">
      <button id="decrement-btn">- Decrease</button>
      <button id="increment-btn">+ Increase</button>
    </div>

    <button id="reset-btn" style="height: 50px; width: 100%; margin-bottom: 10px; ">
      reset
    </button>

    <button class="theme-btn" id="theme-btn">Toggle Dark Mode</button>
  </div>

  <!-- JAVASCRIPT: LOGIC & INTERACTION -->
  <script>
    // 1. SELECT ELEMENTS FROM THE DOM
    const countDisplay = document.getElementById('count');
    const incrementBtn = document.getElementById('increment-btn');
    const decrementBtn = document.getElementById('decrement-btn');
    const themeBtn = document.getElementById('theme-btn');
    const resetBtn = document.getElementById('reset-btn');

    // 2. STATE (Data holding the current count)
    let currentCount = 0;

    // 3. EVENT LISTENERS & FUNCTIONS
    
    // Increase count
    incrementBtn.addEventListener('click', () => {
      currentCount++;
      countDisplay.textContent = currentCount; // Update HTML text
    });

    // Decrease count
    decrementBtn.addEventListener('click', () => {
      currentCount--;
      countDisplay.textContent = currentCount; // Update HTML text
    });

    resetBtn.addEventListener('click', () => {
      currentCount = 0;
      countDisplay.textContent = currentCount;
    })

    // Toggle Dark Mode class on <body>
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>

</body>
</html>
